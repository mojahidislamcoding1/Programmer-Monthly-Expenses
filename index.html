<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programmer Expenses</title>
 <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="flex justify-center items-center min-h-screen bg-gray-100  pb-4 ">
      <div class="container max-w-md bg-white rounded-xl shadow-lg p-6">
       <!-- Title  -->
        <div id="title" class="text-2xl font-bold mb-6 text-center">
                  💻 <span  class="text-2xl font-bold mb-6 text-center text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">Programmer Expenses Assistant</span> 
        </div>

        <!-- Tabs for assistant and history  -->
         <div class="flex justify-between mb-6">
                 <button
            id="assistant-tab"
            class="w-1/2 py-2 rounded-l-md focus:outline-none transition-colors duration-200 text-white font-semibold bg-gradient-to-r from-blue-500 to-purple-600"
          >
            Assistant
          </button>
          <button
            id="history-tab"
            class="w-1/2 py-2 rounded-r-md focus:outline-none transition-colors duration-200 text-gray-600 font-semibold"
          >
            History
          </button>
         </div>
          
         <!-- Expense form  -->
          <div id="expense-form" class="grid grid-cols-2 gap-4">

            <!-- Income  -->
             <div class="relative col-span-2">
              <label class="block font-semibold mb-2 text-gray-700">Income 💰</label>

              <input id="income" 
              class="w-full border border-gray-300 px-3 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200" 
              type="number" 
              placeholder="Enter income">
              <p id="income-error" class="text-red-600 text-xs mt-1 hidden">
              ⚠️ Invalid income!
            </p> 
             </div>

            <!-- Software subscriptions  -->
             <div class="relative">
              <label class="block font-semibold mb-2 text-gray-700">Software 💻</label>

              <input id="software" 
              class="w-full border border-gray-300 px-3 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200" 
              type="number" 
              placeholder="Software Cost">
              <p id="Software-error" class="text-red-600 text-xs mt-1 hidden">
              ⚠️ Invalid amount !
            </p> 
             </div>

            <!-- Courses / Books  -->
             <div class="relative">
              <label class="block font-semibold mb-2 text-gray-700">Course 📚</label>

              <input id="course" 
              class="w-full border border-gray-300 px-3 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200" 
              type="number" 
              placeholder="Course Expense">
              <p id="course-error" class="text-red-600 text-xs mt-1 hidden">
              ⚠️ Invalid amount!
            </p> 
             </div>

            <!-- Internet  -->
             <div class="relative">
              <label class="block font-semibold mb-2 text-gray-700">Internet 🌐</label>

              <input id="internet" 
              class="w-full border border-gray-300 px-3 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200" 
              type="number" 
              placeholder="Internet Bill">
              <p id="internet-error" class="text-red-600 text-xs mt-1 hidden">
              ⚠️ Invalid amount!
            </p> 
             </div>

          <!-- calculate Button  -->

                  <button
            id="calculate"
            class="col-span-2 text-white px-4 py-2 rounded-md font-semibold text-sm transition-all duration-200 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 focus:ring-blue-500"
          >
            Calculate
                  </button>

                  <!-- Saving  -->

                  <div class="relative col-span-2 ">
                    <label class="block font-semibold mb-2 text-gray-700">Savings (%) 💸</label>
                     <input id="savings" 
              class="w-full border border-gray-300 px-3 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200" 
              type="number" 
              placeholder="Savings Amount (%)">
              <p id="saving-error" class="text-red-600 text-xs mt-1 hidden">
              ⚠️ Invalid amount!
            </p> 
                  </div>

                  <!-- Savings Button  -->

                  <button
            id="calculate-Savings"
            class="col-span-2 text-white px-4 py-2 rounded-md font-semibold text-sm transition-all duration-200 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 bg-gradient-to-r from-green-500 to-teal-500 hover:from-green-600 focus:ring-green-500"
          >
           Calculate Savings
                  </button>
          </div>

          <!-- Result  -->
           <div
          id="results"
          class="mt-8 hidden  from-blue-50 to-purple-50 p-4 rounded-lg shadow-md border border-blue-200"
        >
          <h3
            class="text-lg font-semibold mb-4 text-center text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600"
          >
            Results Summary
          </h3>
          <div class="grid grid-cols-2 gap-3">
            <div
              class="bg-white p-3 rounded-md shadow-sm border-l-2 border-blue-500"
            >
              <p class="text-xs text-gray-500">Total Expenses</p>
              <p class="text-sm font-bold text-gray-800">
                ৳ <span id="total-expenses">00</span>
              </p>
            </div>
            <div
              class="bg-white p-3 rounded-md shadow-sm border-l-2 border-green-500"
            >
              <p class="text-xs text-gray-500">Balance</p>
              <p class="text-sm font-bold text-gray-800">
                ৳ <span id="balance">00</span>
              </p>
            </div>
            <div
              class="bg-white p-3 rounded-md shadow-sm border-l-2 border-purple-500"
            >
              <p class="text-xs text-gray-500">Savings Amount</p>
              <p class="text-sm font-bold text-gray-800">
                ৳ <span id="savings-amount">00</span>
              </p>
            </div>
            <div
              class="bg-white p-3 rounded-md shadow-sm border-l-2 border-yellow-500"
            >
              <p class="text-xs text-gray-500">Remaining Balance</p>
              <p class="text-sm font-bold text-gray-800">
                ৳ <span id="remaining-balance">00</span>
              </p>
            </div>
          </div>
        </div>
           <!-- Error Messages -->
        <p id="logic-error" class="text-red-500 mt-4 hidden text-center">
          ⚠️ Total expenses cannot exceed your income!
        </p>
         <!-- History Section -->
        <div
          id="history-section"
          class="bg-gradient-to-br hidden from-blue-50 to-purple-50 p-4 rounded-lg shadow-md border border-blue-200"
        >
          <h3
            class="text-lg font-semibold mb-4 text-center text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600"
          >
            🕒 Expense History
          </h3>
          <div id="history-list" class="grid grid-cols-2 gap-3"></div>
        </div>

      </div>
    </div>

  <script src="js/index.js"></script>
</body>
</html>
